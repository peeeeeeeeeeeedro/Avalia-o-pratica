
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            width: 350px;
            max-width: 90%;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #2563eb;
            border-color: #2563eb;
        }

        .botoes {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-entrar {
            background: #2563eb;
            color: white;
        }

        .btn-entrar:hover {
            background: #1d4ed8;
        }

        .btn-limpar {
            background: #e5e7eb;
            color: #333;
        }

        .btn-limpar:hover {
            background: #d1d5db;
        }

        #mensagem {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Login do Sistema</h2>

        <form id="formLogin">
            <label for="login">Login:</label>
            <input
                type="text"
                id="login"
                placeholder="Digite seu login"
                autocomplete="username"
            >

            <label for="senha">Senha:</label>
            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
            >

            <div class="botoes">
                <button type="submit" class="btn-entrar">
                    Entrar
                </button>

                <button type="reset" class="btn-limpar">
                    Limpar
                </button>
            </div>

            <p id="mensagem" role="status" aria-live="polite"></p>
        </form>
    </div>

    <script>
        const form = document.getElementById("formLogin");
        const campoLogin = document.getElementById("login");
        const campoSenha = document.getElementById("senha");
        const mensagem = document.getElementById("mensagem");

        // Credenciais de demonstração
        const usuarioValido = "admin";
        const senhaValida = "123456";

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const login = campoLogin.value.trim();
            const senha = campoSenha.value;

            // 1. Validar campos obrigatórios
            if (login === "" || senha.trim() === "") {
                mensagem.style.color = "red";
                mensagem.textContent =
                    "Preencha todos os campos obrigatórios.";
                return;
            }

            // 2. Validar as credenciais
            if (
                login === usuarioValido &&
                senha === senhaValida
            ) {
                window.location.href = "5telainicial.html";
        
            

                // 3. Permitir acesso
                setTimeout(function() {
                    alert("Bem-vindo ao sistema!");
                    // Aqui você pode redirecionar para outra página:
                    // window.location.href = "inicio.html";
                }, 300);
            } else {
                mensagem.style.color = "red";
                mensagem.textContent =
                    "Login ou senha inválidos!";
            }
        });

        // Limpar campos e mensagens
        form.addEventListener("reset", function() {
            mensagem.textContent = "";
        });
    </script>

</body>
</html>
